# Shared splash and launcher demo; app pages are placeholders.
esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lvgl.page.show: home_page

lvgl:
  buffer_size: 100%
  default_font: nabla_font_20
  pages:
    - id: splash_page
      bg_color: ${nabla_background}
      widgets:
        - image:
            src: nabla_logo
            align: CENTER
        - label:
            text: "nabla.net"
            text_font: nabla_font_28
            text_color: ${nabla_accent}
            align: CENTER
            y: 95
    - id: home_page
      bg_color: ${nabla_background}
      widgets:
        - !include ../../navigation/launcher.yaml
    - id: app_page
      bg_color: ${nabla_background}
      text_color: ${nabla_text}
      widgets:
        - label:
            id: app_title
            text: ""
            text_font: nabla_font_28
            text_color: ${nabla_accent}
            align: CENTER
            y: -35
        - label:
            text: "Próximamente"
            align: CENTER
            y: 10
        - button:
            width: 150
            height: 44
            align: BOTTOM_MID
            y: -25
            bg_color: ${nabla_accent}
            widgets:
              - label:
                  text: "Volver"
                  text_color: ${nabla_background}
                  align: CENTER
            on_click:
              - lvgl.page.show: home_page
