# Reusable launcher tile. Parameters: tile_id, title, icon, column, row.
button:
  id: ${tile_id}
  grid_cell_column_pos: ${column}
  grid_cell_row_pos: ${row}
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  bg_color: 0x181818
  border_color: ${nabla_secondary}
  border_width: 1
  shadow_width: 0
  radius: 12
  pressed:
    border_color: 0xFFFFFF
    border_width: 2
  widgets:
    - label:
        id: ${tile_id}_icon
        text: ""
        text_color: 0xFFFFFF
        text_font: nabla_icons_32
        align: CENTER
        y: -16
    - label:
        id: ${tile_id}_title
        text: ""
        text_font: nabla_font_16
        align: BOTTOM_MID
        y: -8
  on_press:
    - script.stop: nav_choose
    - script.execute:
        id: nav_focus
        index: ${slot}
  on_click:
    - script.execute:
        id: nav_choose
        index: ${slot}
