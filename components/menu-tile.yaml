# Reusable launcher tile. Parameters: tile_id, title, icon, column, row.
button:
  id: ${tile_id}
  grid_cell_column_pos: ${column}
  grid_cell_row_pos: ${row}
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  bg_color: 0x07141C
  border_color: ${nabla_accent}
  border_width: 1
  radius: 12
  pressed:
    bg_color: 0x124456
    border_color: 0xFFFFFF
    border_width: 2
  widgets:
    - label:
        id: ${tile_id}_icon
        text: ""
        text_color: ${nabla_accent}
        text_font: nabla_icons_32
        align: CENTER
        y: -16
    - label:
        id: ${tile_id}_title
        text: ""
        text_font: nabla_font_16
        align: BOTTOM_MID
        y: -8
  on_click:
    - script.execute:
        id: nav_choose
        index: ${slot}
