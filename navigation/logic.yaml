esphome:
  includes:
    - ../navigation/tree.h

globals:
  - id: nav_dark
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: nav_current
    type: int
    initial_value: '0'
  - id: nav_selection
    type: int
    initial_value: '0'
  - id: nav_crumbs
    type: std::vector<int>
  - id: nav_saved_focus
    type: std::vector<int>
    initial_value: 'std::vector<int>(nabla::count, 0)'
  - id: nav_saved_scroll
    type: std::vector<int>
    initial_value: 'std::vector<int>(nabla::count, 0)'

script:
  - id: nav_choose
    mode: restart
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: |-
              return index >= 0 && index < nabla::children(id(nav_current)) + (id(nav_current) ? 1 + id(nav_crumbs).size() : 1);
          then:
            - lambda: |-
                id(nav_selection) = index;
            - script.execute: nav_render
            - delay: 120ms
            - script.execute:
                id: nav_open
                node: !lambda |-
                  int n = id(nav_current), chosen = id(nav_selection);
                  int total = nabla::children(n);
                  if (chosen < total) return nabla::child(n, chosen);
                  if (chosen == total) return n ? nabla::nodes[n].parent : 0;
                  chosen -= total + 1;
                  if (chosen < (int) id(nav_crumbs).size() - 1) return id(nav_crumbs)[chosen];
                  return nabla::nodes[n].parent;
  - id: nav_open
    parameters:
      node: int
    then:
      - if:
          condition:
            lambda: |-
              return nabla::valid(node);
          then:
            - lambda: |-
                if (nabla::nodes[node].action != 0) {
                  id(nav_dark) = nabla::nodes[node].action == 1;
                  node = nabla::nodes[node].parent;
                }
                int old = id(nav_current);
                id(nav_saved_focus)[old] = id(nav_selection);
                if (old) id(nav_saved_scroll)[old] = lv_obj_get_scroll_y(id(navigation_content));
                id(nav_current) = node;
                id(nav_selection) = id(nav_saved_focus)[node];
            - script.execute: nav_render
            - lambda: |-
                if (node) {
                  lv_obj_update_layout(id(navigation_content));
                  lv_obj_scroll_to_y(id(navigation_content), id(nav_saved_scroll)[node], LV_ANIM_OFF);
                }
  - id: nav_back
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: !lambda |-
            return id(nav_current) ? nabla::nodes[id(nav_current)].parent : 0;
  - id: nav_home
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: 0
  - id: nav_move
    parameters:
      delta: int
    then:
      - script.stop: nav_choose
      - lambda: |-
          int total = nabla::children(id(nav_current)) + (id(nav_current) ? 1 + id(nav_crumbs).size() : 1);
          if (total) id(nav_selection) = (id(nav_selection) + delta % total + total) % total;
      - script.execute: nav_render
      - lambda: |-
          lv_obj_t *rows[] = {id(nav_row_0), id(nav_row_1), id(nav_row_2), id(nav_row_3), id(nav_row_4), id(nav_row_5), id(nav_row_6), id(nav_row_7)};
          if (id(nav_current) && id(nav_selection) < nabla::children(id(nav_current)))
            lv_obj_scroll_to_view(rows[id(nav_selection)], LV_ANIM_OFF);
  - id: nav_activate
    then:
      - script.execute:
          id: nav_choose
          index: !lambda |-
            return id(nav_selection);
  - id: nav_render
    then:
      - lambda: |-
          int current = id(nav_current);
          int total = nabla::children(current);
          auto border = [](lv_obj_t *obj, bool selected) {
            lv_obj_set_style_border_color(obj, lv_color_hex(selected ? 0xFFFFFF : ${nabla_secondary}), 0);
            lv_obj_set_style_border_width(obj, selected ? 2 : (${nabla_monochrome} ? 0 : 1), 0);
          };
          ESP_LOGI("navigation", "%s [focus %d]", nabla::path(current).c_str(), id(nav_selection));
          lv_obj_remove_flag(id(navigation_toolbar), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_bg_color(id(home_page)->obj, lv_color_hex(id(nav_dark) ? 0x000000 : 0xF2F7FA), 0);
          lv_obj_set_style_bg_color(id(navigation_page)->obj, lv_color_hex(id(nav_dark) ? 0x000000 : 0xF2F7FA), 0);
          lv_obj_set_style_text_color(id(nav_detail), lv_color_hex(id(nav_dark) ? 0xF2F7FA : 0x101823), 0);
          lv_label_set_text(id(nav_detail), nabla::nodes[current].detail);
          lv_obj_t *tiles[] = {id(menu_tile_0), id(menu_tile_1), id(menu_tile_2), id(menu_tile_3), id(menu_tile_4), id(menu_tile_5), id(menu_tile_6), id(menu_tile_7)};
          lv_obj_t *rows[] = {id(nav_row_0), id(nav_row_1), id(nav_row_2), id(nav_row_3), id(nav_row_4), id(nav_row_5), id(nav_row_6), id(nav_row_7)};
          lv_obj_t *labels[] = {id(nav_row_label_0), id(nav_row_label_1), id(nav_row_label_2), id(nav_row_label_3), id(nav_row_label_4), id(nav_row_label_5), id(nav_row_label_6), id(nav_row_label_7)};
          lv_obj_t *tile_icons[] = {id(menu_tile_0_icon), id(menu_tile_1_icon), id(menu_tile_2_icon), id(menu_tile_3_icon), id(menu_tile_4_icon), id(menu_tile_5_icon), id(menu_tile_6_icon), id(menu_tile_7_icon)};
          lv_obj_t *tile_titles[] = {id(menu_tile_0_title), id(menu_tile_1_title), id(menu_tile_2_title), id(menu_tile_3_title), id(menu_tile_4_title), id(menu_tile_5_title), id(menu_tile_6_title), id(menu_tile_7_title)};
          for (int i = 0; i < 8; i++) {
            int root_child = nabla::child(0, i);
            if (root_child < 0) lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(tile_icons[i], nabla::nodes[root_child].icon);
              lv_label_set_text(tile_titles[i], nabla::nodes[root_child].title);
            }
            border(tiles[i], id(nav_selection) == i);
            if (root_child >= 0) {
              auto color = lv_color_hex(id(nav_dark) ? nabla::nodes[root_child].bg_dark : nabla::nodes[root_child].bg_light);
              lv_obj_set_style_bg_color(tiles[i], color, 0);
              lv_obj_set_style_bg_color(tiles[i], color, LV_STATE_PRESSED);
            }
            lv_obj_set_style_text_color(tile_titles[i], lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(tile_icons[i], lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_bg_color(rows[i], lv_color_hex(id(nav_dark) ? 0x181818 : 0x404040), 0);
            lv_obj_set_style_bg_color(rows[i], lv_color_hex(id(nav_dark) ? 0x181818 : 0x404040), LV_STATE_PRESSED);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0xFFFFFF), 0);
            int n = nabla::child(current, i);
            if (n < 0) lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(labels[i], nabla::nodes[n].title);
              border(rows[i], id(nav_selection) == i);
            }
          }
          if (current) {
            lv_obj_add_flag(id(toolbar_wifi), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_bluetooth), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(toolbar_wifi), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(toolbar_bluetooth), LV_OBJ_FLAG_HIDDEN);
          }
          const bool loading = id(toolbar_progress) >= 0;
          const auto toolbar_bg = lv_color_hex(id(nav_dark) ? 0x000000 : 0xFFFFFF);
          const auto toolbar_fg = lv_color_hex(id(nav_dark) ? 0xFFFFFF : 0x000000);
          lv_obj_set_style_bg_color(id(navigation_toolbar), toolbar_bg, 0);
          if (loading) {
            lv_obj_remove_flag(id(progress_footer), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text_fmt(id(footer_progress_label), "%d%%", id(toolbar_progress));
            int width = (${screen_width} - 88) * id(toolbar_progress) / 100;
            if (width == 0) lv_obj_add_flag(id(footer_progress_fill), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(footer_progress_fill), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_width(id(footer_progress_fill), width);
            }
          } else lv_obj_add_flag(id(progress_footer), LV_OBJ_FLAG_HIDDEN);
          int footer_height = loading ? ${nabla_bar_height} : 0;
          lv_obj_set_height(id(launcher_content), ${screen_height} - ${nabla_bar_height} - footer_height);
          lv_obj_set_height(id(navigation_content), ${screen_height} - ${nabla_bar_height} - 12 - footer_height);
          auto toolbar_style = [toolbar_fg](lv_obj_t *button, lv_obj_t *label, bool selected) {
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, LV_STATE_PRESSED);
            lv_obj_set_style_border_color(button, toolbar_fg, 0);
            lv_obj_set_style_border_width(button, selected ? 1 : 0, 0);
            lv_obj_set_style_shadow_width(button, 0, 0);
            if (label) lv_obj_set_style_text_color(label, toolbar_fg, 0);
          };
          toolbar_style(id(toolbar_home), nullptr, current == 0 && id(nav_selection) == total);
          nabla_logo::turn(id(toolbar_logo_image), current != 0 && id(nav_selection) == total);
          id(nav_crumbs).clear();
          if (current) {
            lv_obj_remove_flag(id(toolbar_close), LV_OBJ_FLAG_HIDDEN);
            // Keep the current title; collapse distant ancestors to a parent link.
            std::vector<int> ancestors;
            for (int n = nabla::nodes[current].parent; n > 0; n = nabla::nodes[n].parent)
              ancestors.insert(ancestors.begin(), n);
            const lv_font_t *font = id(nabla_font_bold_16)->get_lv_font();
            auto width = [font](const char *text) {
              lv_point_t size;
              lv_text_get_size(&size, text, font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              return (int) size.x + 22;
            };
            int available = ${screen_width} - 108;
            int needed = width(nabla::nodes[current].title);
            for (int n : ancestors) needed += width(nabla::nodes[n].title);
            bool collapsed = ancestors.size() > 2 || needed > available;
            if (collapsed && !ancestors.empty()) id(nav_crumbs).push_back(ancestors.back());
            else id(nav_crumbs) = ancestors;
            id(nav_crumbs).push_back(current);
            lv_obj_t *buttons[] = {id(toolbar_crumb_0), id(toolbar_crumb_1), id(toolbar_crumb_2)};
            lv_obj_t *texts[] = {id(toolbar_crumb_label_0), id(toolbar_crumb_label_1), id(toolbar_crumb_label_2)};
            int x = 54;
            for (int i = 0; i < 3; i++) {
              if (i >= (int) id(nav_crumbs).size()) { lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_remove_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
              const char *title = collapsed && i == 0 && id(nav_crumbs).size() > 1 ? "..." : nabla::nodes[id(nav_crumbs)[i]].title;
              int w = std::min(width(title), available);
              if (i + 1 < (int) id(nav_crumbs).size()) w = std::min(w, std::max(40, available - 100));
              lv_obj_set_x(buttons[i], x);
              lv_obj_set_width(buttons[i], w);
              lv_label_set_text(texts[i], title);
              bool is_current = id(nav_crumbs)[i] == current;
              if (is_current) lv_obj_remove_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
              else lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
              lv_obj_set_style_text_font(texts[i], is_current ? id(nabla_font_bold_16)->get_lv_font() : id(nabla_font_16)->get_lv_font(), 0);
              toolbar_style(buttons[i], texts[i], !is_current && id(nav_selection) == total + 1 + i);
              x += w; available -= w;
            }
            toolbar_style(id(toolbar_close), nullptr, id(nav_selection) == total + (int) id(nav_crumbs).size());
          } else {
            lv_obj_add_flag(id(toolbar_close), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_crumb_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_crumb_2), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(toolbar_crumb_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(toolbar_crumb_0), 54);
            lv_obj_set_width(id(toolbar_crumb_0), ${screen_width} - 148);
            lv_label_set_text(id(toolbar_crumb_label_0), nabla::nodes[0].title);
            lv_obj_remove_flag(id(toolbar_crumb_0), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_style_text_font(id(toolbar_crumb_label_0), id(nabla_font_bold_16)->get_lv_font(), 0);
            toolbar_style(id(toolbar_crumb_0), id(toolbar_crumb_label_0), false);
          }
      - if:
          condition:
            lambda: |-
              return id(nav_current) == 0;
          then:
            - lvgl.page.show: home_page
          else:
            - lvgl.page.show: navigation_page
