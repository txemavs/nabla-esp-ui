# Parameters: widget_id, size, image_id.
obj:
  id: ${widget_id}
  width: ${size}
  height: ${size}
  align: CENTER
  bg_opa: TRANSP
  border_width: 0
  pad_all: 0
  clickable: false
  scrollbar_mode: "OFF"
  widgets:
    - obj:
        id: ${widget_id}_down
        width: 100%
        height: 100%
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        clickable: false
        widgets:
          - image:
              id: ${widget_id}_image
              src: ${image_id}
              align: CENTER
              image_recolor: ${nabla_accent}
              image_recolor_opa: COVER
              antialias: true
              clickable: false
