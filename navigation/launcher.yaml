# One menu definition for the initial landscape profile.
obj:
  width: 100%
  height: 100%
  bg_opa: TRANSP
  border_width: 0
  pad_all: 12
  layout:
    type: grid
    pad_row: 10
    pad_column: 10
    grid_columns: [FR(1), FR(1), FR(1), FR(1)]
    grid_rows: [FR(1), FR(1)]
  widgets:
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_0
          node: 1
          title: "${tr_settings}"
          icon: "${icon_settings}"
          column: 0
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_1
          node: 2
          title: "${tr_clock}"
          icon: "${icon_clock}"
          column: 1
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_2
          node: 3
          title: "${tr_photos}"
          icon: "${icon_photos}"
          column: 2
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_3
          node: 4
          title: "${tr_music}"
          icon: "${icon_music}"
          column: 3
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_4
          node: 5
          title: "${tr_video}"
          icon: "${icon_video}"
          column: 0
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_5
          node: 6
          title: "${tr_weather}"
          icon: "${icon_weather}"
          column: 1
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_6
          node: 7
          title: "${tr_lights}"
          icon: "${icon_lights}"
          column: 2
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_7
          node: 8
          title: "${tr_sensors}"
          icon: "${icon_sensors}"
          column: 3
          row: 1
