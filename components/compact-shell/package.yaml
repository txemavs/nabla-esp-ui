# Export helpers from the same checkout as the external component.
nabla_runtime:
  - headers:
      - components/forms/wifi_flow.h
      - components/forms/compact_wifi.h
      - navigation/focus.h
      - profiles/geometry.h
      - components/compact-shell/model.h
      - components/compact-shell/render.h
