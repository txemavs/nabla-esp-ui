# One menu definition for the initial landscape profile.
obj:
  width: 100%
  y: 52
  height: ${(screen_height | int) - 52}
  bg_opa: TRANSP
  border_width: 0
  pad_all: 12
  layout:
    type: grid
    pad_row: 10
    pad_column: 10
    grid_columns: [FR(1), FR(1), FR(1), FR(1)]
    grid_rows: [FR(1), FR(1)]
  widgets:
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_0
          slot: 0
          column: 0
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_1
          slot: 1
          column: 1
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_2
          slot: 2
          column: 2
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_3
          slot: 3
          column: 3
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_4
          slot: 4
          column: 0
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_5
          slot: 5
          column: 1
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_6
          slot: 6
          column: 2
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_7
          slot: 7
          column: 3
          row: 1
