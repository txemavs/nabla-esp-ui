# Theme-aware toolbar; one shared logo for startup and navigation.
obj:
  <<: !include
    file: ../bar/surface.yaml
    vars:
      bar_id: navigation_toolbar
      anchor: ${nabla_toolbar_align}
      background: ${nabla_background}
  widgets:
    - label:
        id: toolbar_wifi
        x: ${(screen_width | int) - 84}
        y: 6
        width: 32
        text_align: CENTER
        text: "\uf1eb"
        text_font: nabla_toolbar_icons
        text_color: ${nabla_secondary}
        clickable: false
    - label:
        id: toolbar_bluetooth
        x: ${(screen_width | int) - 42}
        y: 6
        width: 32
        text_align: CENTER
        text: "\uf293"
        text_font: nabla_toolbar_brands
        text_color: ${nabla_secondary}
        clickable: false
    - button:
        id: toolbar_home
        x: 4
        y: 0
        width: 44
        height: ${nabla_bar_height}
        pad_all: 0
        bg_opa: TRANSP
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - !include
              file: ../logo/widget.yaml
              vars:
                widget_id: toolbar_logo
                size: 36
                image_id: nabla_logo_small
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current));
    - button:
        id: toolbar_crumb_0
        x: 54
        y: 0
        width: 110
        height: ${nabla_bar_height}
        pad_all: 2
        bg_opa: TRANSP
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_0
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda 'return id(nav_current) ? nabla::children(id(nav_current)) + 1 : -1;'
    - button:
        id: toolbar_crumb_1
        x: 54
        y: 0
        width: 110
        height: ${nabla_bar_height}
        pad_all: 2
        bg_opa: TRANSP
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_1
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 1;
    - button:
        id: toolbar_crumb_2
        x: 54
        y: 0
        width: 110
        height: ${nabla_bar_height}
        pad_all: 2
        bg_opa: TRANSP
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_2
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 2;
    - button:
        id: toolbar_close
        align: TOP_RIGHT
        x: -4
        y: 0
        width: 44
        height: ${nabla_bar_height}
        bg_opa: TRANSP
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_close_label
              text: "\uf00d"
              text_font: nabla_toolbar_icons
              text_color: ${nabla_error}
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + id(nav_crumbs).size();
