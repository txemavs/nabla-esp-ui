esphome:
  includes:
    - ../navigation/tree.h
    - ../navigation/orientation.h

globals:
  - id: nav_list_view
    type: bool
    initial_value: 'false'
  - id: nav_angle
    type: int
    initial_value: '0'
  - id: nav_dark
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: nav_current
    type: int
    initial_value: '0'
  - id: nav_selection
    type: int
    initial_value: '0'
  - id: nav_crumbs
    type: std::vector<int>
  - id: nav_saved_focus
    type: std::vector<int>
    initial_value: 'std::vector<int>(nabla::count, 0)'
  - id: nav_saved_scroll
    type: std::vector<int>
    initial_value: 'std::vector<int>(nabla::count, 0)'

script:
  - id: nav_rotate
    then:
      - lambda: |-
          nabla_orientation::prepare();
          id(nav_angle) = (id(nav_angle) + 90) % 360;
          id(nabla_lvgl).set_rotation(id(nav_angle));
      - script.execute: nav_render
  - id: nav_choose
    mode: restart
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: |-
              return index >= 0 && index < nabla::children(id(nav_current)) + (id(nav_current) ? 1 + id(nav_crumbs).size() : 2);
          then:
            - lambda: |-
                id(nav_selection) = index;
            - script.execute: nav_render
            - delay: 120ms
            - script.execute:
                id: nav_open
                node: !lambda |-
                  int n = id(nav_current), chosen = id(nav_selection);
                  int total = nabla::children(n);
                  if (chosen < total) return nabla::child(n, chosen);
                  if (!n && chosen == total + 1) { id(nav_rotate).execute(); return -1; }
                  if (chosen == total) {
                    if (!n) id(nav_list_view) = !id(nav_list_view);
                    return n ? nabla::nodes[n].parent : 0;
                  }
                  chosen -= total + 1;
                  if (chosen < (int) id(nav_crumbs).size() - 1) return id(nav_crumbs)[chosen];
                  return nabla::nodes[n].parent;
  - id: nav_open
    parameters:
      node: int
    then:
      - if:
          condition:
            lambda: |-
              return nabla::valid(node);
          then:
            - lambda: |-
                if (nabla::nodes[node].action == 1 || nabla::nodes[node].action == 2) {
                  id(nav_dark) = nabla::nodes[node].action == 1;
                  node = nabla::nodes[node].parent;
                }
                int old = id(nav_current);
                if (old != node && nabla::nodes[old].action == 3)
                  nabla_wifi_form::editor.clear();
                if (old != node && nabla::nodes[node].action == 3)
                  id(wifi_form_bind).execute();
                id(nav_saved_focus)[old] = id(nav_selection);
                if (old || id(nav_list_view)) id(nav_saved_scroll)[old] = lv_obj_get_scroll_y(id(navigation_content));
                id(nav_current) = node;
                id(nav_selection) = nabla::nodes[node].action == 3 ? -1 : id(nav_saved_focus)[node];
                if (old != node && nabla::children(node) > 0) {
                  // Entering a child starts at its first option; returning keeps
                  // the previous content item, never a saved toolbar control.
                  bool entering = nabla::nodes[node].parent == old;
                  if (entering || id(nav_selection) < 0 ||
                      id(nav_selection) >= nabla::children(node)) {
                    id(nav_selection) = 0;
                    id(nav_saved_scroll)[node] = 0;
                  }
                }
            - script.execute: nav_render
            - lambda: |-
                if (node || id(nav_list_view)) {
                  lv_obj_update_layout(id(navigation_content));
                  lv_obj_scroll_to_y(id(navigation_content), id(nav_saved_scroll)[node], LV_ANIM_OFF);
                }
  - id: nav_back
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: !lambda |-
            return id(nav_current) ? nabla::nodes[id(nav_current)].parent : 0;
  - id: nav_home
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: 0
  - id: nav_move
    parameters:
      delta: int
    then:
      - if:
          condition:
            lambda: return nabla::nodes[id(nav_current)].action == 3;
          then:
            - lambda: nabla_wifi_form::editor.move(delta);
          else:
            - script.stop: nav_choose
            - lambda: |-
                int total = nabla::children(id(nav_current)) + (id(nav_current) ? 1 + id(nav_crumbs).size() : 2);
                if (total) id(nav_selection) = (id(nav_selection) + delta % total + total) % total;
            - script.execute: nav_render
            - lambda: |-
                lv_obj_t *rows[] = {id(nav_row_0), id(nav_row_1), id(nav_row_2), id(nav_row_3), id(nav_row_4), id(nav_row_5), id(nav_row_6), id(nav_row_7)};
                if ((id(nav_current) || id(nav_list_view)) && id(nav_selection) < nabla::children(id(nav_current)))
                  lv_obj_scroll_to_view(rows[id(nav_selection)], LV_ANIM_OFF);
  - id: nav_activate
    then:
      - if:
          condition:
            lambda: return nabla::nodes[id(nav_current)].action == 3;
          then:
            - lambda: nabla_wifi_form::editor.activate();
          else:
            - script.execute:
                id: nav_choose
                index: !lambda |-
                  return id(nav_selection);
  - id: nav_render
    then:
      - lambda: |-
          int current = id(nav_current);
          int screen_w = lv_display_get_horizontal_resolution(lv_display_get_default());
          int screen_h = lv_display_get_vertical_resolution(lv_display_get_default());
          const bool portrait = screen_w < screen_h;
          const auto foreground = lv_color_hex(id(nav_dark) ? 0xFFFFFF : 0x000000);
          const auto background = lv_color_hex(id(nav_dark) ? 0x000000 : 0xFFFFFF);
          static const int32_t grid_four[] = {LV_GRID_FR(1), LV_GRID_FR(1), LV_GRID_FR(1), LV_GRID_FR(1), LV_GRID_TEMPLATE_LAST};
          static const int32_t grid_two[] = {LV_GRID_FR(1), LV_GRID_FR(1), LV_GRID_TEMPLATE_LAST};
          lv_obj_set_grid_dsc_array(id(launcher_content), portrait ? grid_two : grid_four, portrait ? grid_four : grid_two);
          lv_obj_set_width(id(navigation_content), screen_w - 8);
          lv_obj_set_width(id(nav_detail), screen_w - 16);
          if (nabla::nodes[current].detail[0]) lv_obj_remove_flag(id(nav_detail), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(nav_detail), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_x(id(toolbar_wifi), screen_w - 84);
          lv_obj_set_x(id(toolbar_bluetooth), screen_w - 42);
          lv_obj_set_x(id(toolbar_rotate), screen_w - 126);
          lv_obj_set_width(id(footer_brand), screen_w - 96);
          lv_obj_set_width(id(footer_progress_track), screen_w - 88);

          int total = nabla::children(current);
          auto border = [&](lv_obj_t *obj, bool selected) {
            lv_obj_set_style_border_color(obj, selected ? foreground : lv_color_hex(${nabla_secondary}), 0);
            lv_obj_set_style_border_width(obj, selected ? 2 : (${nabla_monochrome} ? 0 : 1), 0);
            lv_obj_set_style_border_color(obj, foreground, LV_STATE_PRESSED);
          };
          ESP_LOGI("navigation", "%s [focus %d]", nabla::path(current).c_str(), id(nav_selection));
          lv_obj_remove_flag(id(navigation_toolbar), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_bg_color(id(home_page)->obj, background, 0);
          lv_obj_set_style_bg_color(id(navigation_page)->obj, background, 0);
          lv_obj_set_style_text_color(id(nav_detail), foreground, 0);
          lv_label_set_text(id(nav_detail), nabla::nodes[current].detail);
          lv_obj_t *tiles[] = {id(menu_tile_0), id(menu_tile_1), id(menu_tile_2), id(menu_tile_3), id(menu_tile_4), id(menu_tile_5), id(menu_tile_6), id(menu_tile_7)};
          lv_obj_t *rows[] = {id(nav_row_0), id(nav_row_1), id(nav_row_2), id(nav_row_3), id(nav_row_4), id(nav_row_5), id(nav_row_6), id(nav_row_7)};
          lv_obj_t *labels[] = {id(nav_row_label_0), id(nav_row_label_1), id(nav_row_label_2), id(nav_row_label_3), id(nav_row_label_4), id(nav_row_label_5), id(nav_row_label_6), id(nav_row_label_7)};
          lv_obj_t *tile_icons[] = {id(menu_tile_0_icon), id(menu_tile_1_icon), id(menu_tile_2_icon), id(menu_tile_3_icon), id(menu_tile_4_icon), id(menu_tile_5_icon), id(menu_tile_6_icon), id(menu_tile_7_icon)};
          lv_obj_t *tile_titles[] = {id(menu_tile_0_title), id(menu_tile_1_title), id(menu_tile_2_title), id(menu_tile_3_title), id(menu_tile_4_title), id(menu_tile_5_title), id(menu_tile_6_title), id(menu_tile_7_title)};
          for (int i = 0; i < 8; i++) {
            int columns = portrait ? 2 : 4;
            lv_obj_set_grid_cell(tiles[i], LV_GRID_ALIGN_STRETCH, i % columns, 1, LV_GRID_ALIGN_STRETCH, i / columns, 1);
            lv_obj_set_width(rows[i], screen_w - 16);
            int root_child = nabla::child(0, i);
            if (root_child < 0) lv_obj_add_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(tiles[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(tile_icons[i], nabla::nodes[root_child].icon);
              lv_label_set_text(tile_titles[i], nabla::nodes[root_child].title);
              lv_obj_update_layout(tiles[i]);
              lv_point_t title_size;
              lv_text_get_size(&title_size, nabla::nodes[root_child].title,
                              id(nabla_font_16)->get_lv_font(), 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              lv_obj_set_style_text_font(tile_titles[i],
                title_size.x > lv_obj_get_width(tiles[i]) - 8
                  ? id(nabla_font_12)->get_lv_font() : id(nabla_font_16)->get_lv_font(), 0);
            }
            border(tiles[i], id(nav_selection) == i);
            if (root_child >= 0) {
              auto color = ${nabla_monochrome} ? background : lv_color_hex(id(nav_dark) ? nabla::nodes[root_child].bg_dark : nabla::nodes[root_child].bg_light);
              lv_obj_set_style_bg_color(tiles[i], color, 0);
              lv_obj_set_style_bg_color(tiles[i], color, LV_STATE_PRESSED);
            }
            lv_obj_set_style_text_color(tile_titles[i], foreground, 0);
            lv_obj_set_style_text_color(tile_icons[i], root_child < 0 || ${nabla_monochrome} ? foreground :
              lv_color_hex(id(nav_dark) ? nabla::nodes[root_child].icon_dark : nabla::nodes[root_child].icon_light), 0);
            lv_obj_set_style_bg_color(rows[i], background, 0);
            lv_obj_set_style_bg_color(rows[i], background, LV_STATE_PRESSED);
            lv_obj_set_style_text_color(labels[i], foreground, 0);
            int n = nabla::child(current, i);
            if (n < 0) lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(labels[i], nabla::nodes[n].title);
              border(rows[i], id(nav_selection) == i);
            }
          }
          if (current) {
            lv_obj_add_flag(id(toolbar_rotate), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_wifi), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_bluetooth), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(toolbar_rotate), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(toolbar_wifi), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(toolbar_bluetooth), LV_OBJ_FLAG_HIDDEN);
          }
          const bool loading = id(toolbar_progress) >= 0;
          const auto toolbar_bg = lv_color_hex(id(nav_dark) ? 0x000000 : 0xFFFFFF);
          const auto toolbar_fg = lv_color_hex(id(nav_dark) ? 0xFFFFFF : 0x000000);
          lv_obj_set_style_bg_color(id(navigation_toolbar), toolbar_bg, 0);
          const bool footer_visible = loading || current == 0;
          lv_obj_set_style_bg_color(id(progress_footer), loading ? lv_color_hex(0x404040) : toolbar_bg, 0);
          lv_obj_set_style_text_color(id(footer_brand), lv_color_hex(${nabla_secondary}), 0);
          lv_obj_set_style_text_color(id(footer_clock), toolbar_fg, 0);
          lv_obj_t *idle_widgets[] = {id(footer_brand), id(footer_clock)};
          for (auto *widget : idle_widgets) {
            if (loading) lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *progress_widgets[] = {id(footer_progress_track), id(footer_progress_label)};
          for (auto *widget : progress_widgets) {
            if (loading) lv_obj_remove_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          if (loading) {
            lv_obj_remove_flag(id(progress_footer), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text_fmt(id(footer_progress_label), "%d%%", id(toolbar_progress));
            int width = (screen_w - 88) * id(toolbar_progress) / 100;
            if (width == 0) lv_obj_add_flag(id(footer_progress_fill), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(footer_progress_fill), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_width(id(footer_progress_fill), width);
            }
          } else if (footer_visible) lv_obj_remove_flag(id(progress_footer), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(progress_footer), LV_OBJ_FLAG_HIDDEN);
          int footer_height = footer_visible ? ${nabla_bar_height} : 0;
          lv_obj_set_height(id(launcher_content), screen_h - ${nabla_bar_height} - footer_height);
          lv_obj_set_height(id(navigation_content), screen_h - ${nabla_bar_height} - 6 - footer_height);
          auto toolbar_style = [toolbar_fg](lv_obj_t *button, lv_obj_t *label, bool selected) {
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, LV_STATE_PRESSED);
            lv_obj_set_style_border_color(button, toolbar_fg, 0);
            lv_obj_set_style_border_width(button, selected ? 1 : 0, 0);
            lv_obj_set_style_shadow_width(button, 0, 0);
            if (label) lv_obj_set_style_text_color(label, toolbar_fg, 0);
          };
          toolbar_style(id(toolbar_home), nullptr, false);
          toolbar_style(id(toolbar_rotate), id(toolbar_rotate_label), !current && id(nav_selection) == total + 1);
          // Focus recolors only the mark; preserve the configured base/status color.
          lv_obj_set_style_image_recolor(id(toolbar_logo_image), foreground, 0);
          lv_obj_set_style_image_recolor_opa(id(toolbar_logo_image), LV_OPA_COVER, 0);
          lv_obj_set_style_image_recolor(id(toolbar_logo_image), foreground, LV_STATE_FOCUSED);
          lv_obj_set_style_text_color(id(toolbar_close_label), ${nabla_monochrome} ? foreground : lv_color_hex(${nabla_error}), 0);
          lv_obj_set_style_image_recolor_opa(id(toolbar_logo_image), LV_OPA_COVER, LV_STATE_FOCUSED);
          if (id(nav_selection) == total) lv_obj_add_state(id(toolbar_logo_image), LV_STATE_FOCUSED);
          else lv_obj_remove_state(id(toolbar_logo_image), LV_STATE_FOCUSED);
          // Fixed optical offset: lower the logo 3 px from its previous position.
          lv_obj_set_y(id(toolbar_logo), 0);
          nabla_logo::turn(id(toolbar_logo_image), current != 0 && id(nav_selection) == total);
          lv_obj_t *separators[] = {id(toolbar_separator_0), id(toolbar_separator_1)};
          for (auto *separator : separators) lv_obj_add_flag(separator, LV_OBJ_FLAG_HIDDEN);
          id(nav_crumbs).clear();
          if (current) {
            lv_obj_remove_flag(id(toolbar_close), LV_OBJ_FLAG_HIDDEN);
            // Keep the current title; collapse distant ancestors to a parent link.
            std::vector<int> ancestors;
            for (int n = nabla::nodes[current].parent; n > 0; n = nabla::nodes[n].parent)
              ancestors.insert(ancestors.begin(), n);
            auto width = [&](const char *text, bool bold) {
              const lv_font_t *font = bold ? id(nabla_font_bold_16)->get_lv_font() : id(nabla_font_16)->get_lv_font();
              lv_point_t size;
              lv_text_get_size(&size, text, font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              return (int) size.x + 6;
            };
            int available = screen_w - 94;
            int needed = width(nabla::nodes[current].title, true);
            for (int n : ancestors) needed += width(nabla::nodes[n].title, false) + 12;
            bool collapsed = ancestors.size() > 2 || needed > available;
            if (collapsed && !ancestors.empty()) id(nav_crumbs).push_back(ancestors.back());
            else id(nav_crumbs) = ancestors;
            id(nav_crumbs).push_back(current);
            lv_obj_t *buttons[] = {id(toolbar_crumb_0), id(toolbar_crumb_1), id(toolbar_crumb_2)};
            lv_obj_t *texts[] = {id(toolbar_crumb_label_0), id(toolbar_crumb_label_1), id(toolbar_crumb_label_2)};
            int x = 40;
            for (int i = 0; i < 3; i++) {
              if (i >= (int) id(nav_crumbs).size()) { lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_remove_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
              const char *title = collapsed && i == 0 && id(nav_crumbs).size() > 1 ? "..." : nabla::nodes[id(nav_crumbs)[i]].title;
              int w = std::min(width(title, id(nav_crumbs)[i] == current), available);
              if (i + 1 < (int) id(nav_crumbs).size()) w = std::min(w, std::max(40, available - 100));
              lv_obj_set_x(buttons[i], x);
              lv_obj_set_width(buttons[i], w);
              lv_label_set_text(texts[i], title);
              bool is_current = id(nav_crumbs)[i] == current;
              if (is_current) lv_obj_remove_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
              else lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_CLICKABLE);
              lv_obj_set_style_text_font(texts[i], is_current ? id(nabla_font_bold_16)->get_lv_font() : id(nabla_font_16)->get_lv_font(), 0);
              toolbar_style(buttons[i], texts[i], !is_current && id(nav_selection) == total + 1 + i);
              x += w; available -= w;
              if (i + 1 < (int) id(nav_crumbs).size()) {
                lv_obj_set_x(separators[i], x);
                lv_obj_remove_flag(separators[i], LV_OBJ_FLAG_HIDDEN);
                x += 12; available -= 12;
              }
            }
            toolbar_style(id(toolbar_close), nullptr, id(nav_selection) == total + (int) id(nav_crumbs).size());
          } else {
            lv_obj_add_flag(id(toolbar_close), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_crumb_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(toolbar_crumb_2), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(toolbar_crumb_0), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(id(toolbar_crumb_0), 40);
            lv_obj_set_width(id(toolbar_crumb_0), screen_w - 174);
            lv_label_set_text(id(toolbar_crumb_label_0), nabla::nodes[0].title);
            lv_obj_remove_flag(id(toolbar_crumb_0), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_style_text_font(id(toolbar_crumb_label_0), id(nabla_font_bold_16)->get_lv_font(), 0);
            toolbar_style(id(toolbar_crumb_0), id(toolbar_crumb_label_0), false);
          }
      - if:
          condition:
            lambda: |-
              return id(nav_current) == 0 && !id(nav_list_view);
          then:
            - lvgl.page.show: home_page
          else:
            - lvgl.page.show: navigation_page
      - if:
          condition:
            lambda: return nabla::nodes[id(nav_current)].action == 3;
          then:
            - lambda: nabla_wifi_form::editor.render(id(nav_dark));
            - lvgl.page.show: wifi_form_page
