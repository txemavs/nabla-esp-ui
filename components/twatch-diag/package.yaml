# T-Watch 2020 diagnostics
# IR, motor, BMA423, AXP202. IDF I2C via write_readv/write only.

globals:
  - id: twatch_diag_motor_count
    type: int
    initial_value: "0"
  - id: twatch_diag_ir_count
    type: int
    initial_value: "0"
  - id: twatch_diag_bma_present
    type: bool
    initial_value: "false"
  - id: twatch_diag_axp_voltage
    type: float
    initial_value: "NAN"
  - id: twatch_diag_axp_present
    type: bool
    initial_value: "false"

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: twatch_scan_i2c
      - lambda: |-
          uint8_t reg = 0x82, value = 0;
          if (id(sensor_i2c).write_readv(0x35, &reg, 1, &value, 1) != i2c::ERROR_OK) return;
          uint8_t enable[] = {0x82, static_cast<uint8_t>(value | 0x80)};
          id(sensor_i2c).write(0x35, enable, 2);

script:
  - id: twatch_test_ir
    mode: single
    then:
      - lambda: id(twatch_diag_ir_count)++;
      - remote_transmitter.transmit_raw:
          transmitter_id: twatch_ir
          # Deliberately not an appliance command: one short optical test burst.
          carrier_frequency: 38kHz
          code: [1000, -1000, 1000]

  - id: twatch_test_motor
    then:
      - lambda: id(twatch_diag_motor_count)++;
      - script.execute:
          id: twatch_vibrate
          duration_ms: 300

  - id: twatch_scan_i2c
    then:
      - lambda: |-
          auto probe = [](uint8_t addr, uint8_t reg, uint8_t expected) -> bool {
            uint8_t v = 0;
            return id(sensor_i2c).write_readv(addr, &reg, 1, &v, 1) == i2c::ERROR_OK && v == expected;
          };
          id(twatch_diag_bma_present) = probe(0x18, 0x00, 0x13) || probe(0x19, 0x00, 0x13);
          id(twatch_diag_axp_present) = probe(0x35, 0x03, 0x41);
          ESP_LOGI("twatch_diag", "I2C scan: BMA423=%s AXP202=%s",
            id(twatch_diag_bma_present) ? "found" : "not found",
            id(twatch_diag_axp_present) ? "found" : "not found");

  - id: twatch_read_battery
    then:
      - lambda: |-
          id(twatch_diag_axp_voltage) = NAN;
          const uint8_t addr = 0x35;
          uint8_t reg = 0x01;
          uint8_t status = 0;
          if (id(sensor_i2c).write_readv(addr, &reg, 1, &status, 1) != i2c::ERROR_OK || !(status & 0x20)) return;
          reg = 0x78;
          uint8_t data[2] = {0};
          if (id(sensor_i2c).write_readv(addr, &reg, 1, data, 2) != i2c::ERROR_OK) return;
          uint16_t raw = ((uint16_t)data[0] << 4) | (data[1] & 0x0F);
          id(twatch_diag_axp_voltage) = raw * 1.1f / 1000.0f;

interval:
  - interval: 2s
    then:
      - script.execute: twatch_read_battery
