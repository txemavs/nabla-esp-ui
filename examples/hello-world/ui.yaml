# Shared splash and launcher demo; app pages are placeholders.
esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: nav_home

packages:
  navigation: !include ../../navigation/logic.yaml

lvgl:
  buffer_size: 100%
  default_font: nabla_font_20
  pages:
    - id: splash_page
      bg_color: ${nabla_background}
      widgets:
        - image:
            src: nabla_logo
            align: CENTER
        - label:
            text: "nabla.net"
            text_font: nabla_font_28
            text_color: ${nabla_accent}
            align: CENTER
            y: 95
    - id: home_page
      bg_color: ${nabla_background}
      widgets:
        - !include ../../navigation/launcher.yaml
    - id: navigation_page
      bg_color: ${nabla_background}
      text_color: ${nabla_text}
      widgets:
        - button:
            x: 8
            y: 6
            width: 90
            height: 36
            bg_color: 0x124456
            widgets:
              - label:
                  text: "Inicio"
                  align: CENTER
                  text_font: nabla_font_16
            on_click:
              - script.execute: nav_home
        - button:
            x: 382
            y: 6
            width: 90
            height: 36
            bg_color: 0x124456
            widgets:
              - label:
                  text: "Volver"
                  align: CENTER
                  text_font: nabla_font_16
            on_click:
              - script.execute: nav_back
        - label:
            id: nav_breadcrumb
            x: 12
            y: 50
            width: 456
            text_font: nabla_font_16
            text_color: ${nabla_accent}
            long_mode: SCROLL_CIRCULAR
            text: ""
        - obj:
            x: 8
            y: 82
            width: 464
            height: 230
            pad_all: 4
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 6
            widgets:
              - label:
                  id: nav_detail
                  width: 440
                  text_font: nabla_font_16
                  text: ""
              - button:
                  id: nav_row_0
                  width: 440
                  height: 48
                  bg_color: 0x07141C
                  border_color: ${nabla_accent}
                  border_width: 1
                  pressed:
                    border_color: 0xFFFFFF
                    border_width: 2
                  widgets:
                    - label:
                        id: nav_row_label_0
                        text: ""
                        align: LEFT_MID
                        text_font: nabla_font_20
                  on_click:
                    - script.execute:
                        id: nav_choose
                        index: 0
              - button:
