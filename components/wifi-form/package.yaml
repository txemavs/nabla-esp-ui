# Wi-Fi editor composition and keyboard defaults; provides a reusable form for regular displays.

substitutions:
  nabla_resource_root: ".."
  nabla_keyboard_latin: "true"

# Wi-Fi form: mock by default, real when the optional nabla_wifi adapter is enabled.

script:
  - id: wifi_form_bind
    then:
      - lambda: |-
          auto &e=nabla_wifi_form::editor;
          e.page=id(wifi_form_page)->obj;e.ssid=id(wifi_form_ssid);
          e.password=id(wifi_form_password);e.keyboard=id(wifi_form_keyboard)->obj;
          e.status=id(wifi_form_status);e.apply=id(wifi_form_apply);e.cancel=id(wifi_form_cancel);
          e.scan=id(wifi_form_scan);e.open_box=id(wifi_form_open);
          static const char *words[] = {"${tr_flow_0}", "${tr_flow_1}", "${tr_flow_2}", "${tr_flow_3}", "${tr_flow_4}", "${tr_flow_5}", "${tr_flow_6}", "${tr_flow_7}", "${tr_flow_8}", "${tr_flow_9}", "${tr_flow_10}", "${tr_flow_11}", "${tr_flow_12}", "${tr_flow_13}", "${tr_flow_14}", "${tr_flow_15}", "${tr_flow_16}", "${tr_flow_17}", "${tr_flow_18}", "${tr_flow_19}", "${tr_flow_20}", "${tr_flow_21}"};
          static const char *real_words[] = {"${tr_wifi_real_0}", "${tr_wifi_real_1}", "${tr_wifi_real_2}", "${tr_wifi_real_3}", "${tr_wifi_real_4}", "${tr_wifi_real_5}"};
          e.words=words;e.real_words=real_words;e.setup_scan();
          lv_textarea_set_password_show_time(e.password,0);
          if(${nabla_keyboard_latin}){
            nabla_keyboard::install(e.keyboard);
            lv_obj_set_style_text_font(e.keyboard,id(nabla_font_16)->get_lv_font(),LV_PART_ITEMS);
          }
          nabla_wifi_form::editor.clear();
      - lambda: nabla_wifi_form::editor.poll();
  - id: wifi_form_accept
    then:
      - lambda: |-
          nabla_wifi_form::editor.submit();
  - id: wifi_form_ready
    then:
      - if:
          condition:
            lambda: return !nabla_wifi_form::editor.editing_password;
          then:
            - lambda: |-
                nabla_wifi_form::editor.edit(true);
                nabla_wifi_form::editor.highlight();
          else:
            - script.execute: wifi_form_accept

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if(nabla_wifi_form::editor.page && nabla::nodes[id(nav_current)].action==3)
            nabla_wifi_form::editor.poll();

lvgl:
  pages:
    - id: wifi_form_page
      bg_color: 0x000000
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - textarea:
            id: wifi_form_ssid
            one_line: true
            max_length: 32
            placeholder_text: "${tr_wifi_form_ssid}"
            text_font: nabla_font_16
            bg_color: 0x181818
            text_color: 0xFFFFFF
            border_color: 0x808080
            border_width: 1
            radius: 5
            pad_all: 7
            on_click:
              - lambda: |-
                  nabla_wifi_form::editor.edit(false);
                  nabla_wifi_form::editor.highlight();
            on_ready:
              - script.execute: wifi_form_ready
            on_value:
              - lambda: |-
                  auto &flow=nabla_wifi_form::editor.flow;
                  if(flow.stage==nabla_forms::Stage::SUCCESS || flow.stage==nabla_forms::Stage::FAILURE)flow.cancel();
                  flow.error=nabla_forms::Error::NONE;
              - lambda: nabla_wifi_form::editor.poll();
        - textarea:
            id: wifi_form_password
            one_line: true
            password_mode: true
            max_length: 63
            placeholder_text: "${tr_password_hint}"
            text_font: nabla_font_16
            bg_color: 0x181818
            text_color: 0xFFFFFF
            border_color: 0x808080
            border_width: 1
            radius: 5
            pad_all: 7
            on_click:
              - lambda: |-
                  nabla_wifi_form::editor.edit(true);
                  nabla_wifi_form::editor.highlight();
            on_ready:
              - script.execute: wifi_form_ready
            on_value:
              - lambda: |-
                  auto &flow=nabla_wifi_form::editor.flow;
                  if(flow.stage==nabla_forms::Stage::SUCCESS || flow.stage==nabla_forms::Stage::FAILURE)flow.cancel();
                  flow.error=nabla_forms::Error::NONE;
              - lambda: nabla_wifi_form::editor.poll();
        - label:
            id: wifi_form_status
            text: "${tr_wifi_form_demo}"
            text_font: nabla_font_12
            long_mode: DOT
        - keyboard:
            id: wifi_form_keyboard
            textarea: wifi_form_ssid
            align: TOP_LEFT
            mode: TEXT_LOWER
            text_font: montserrat_16
            bg_color: 0x000000
            border_width: 0
            pad_all: 2
            items:
              bg_color: 0x181818
              text_color: 0xFFFFFF
              border_color: 0x808080
              border_width: 1
              radius: 5
              shadow_width: 0
              pressed:
                bg_color: 0x181818
                border_color: 0xFFFFFF
                border_width: 2
              focused:
                border_color: 0xFFFFFF
                border_width: 2
            on_value:
              - lambda: |-
                  auto &e=nabla_wifi_form::editor;
                  int selected=lv_buttonmatrix_get_selected_button(e.keyboard);
                  if(selected>=0 && selected<e.keys()){e.focus=selected+2;e.highlight();}
            on_cancel:
              - script.execute: nav_back
        - button:
            id: wifi_form_apply
            bg_color: 0x181818
            border_color: 0x808080
            border_width: 1
            shadow_width: 0
            widgets:
              - label:
                  text: "${tr_wifi_form_apply}"
                  text_font: nabla_font_16
                  align: CENTER
            on_click:
              - script.execute: wifi_form_accept
        - button:
            id: wifi_form_cancel
            bg_color: 0x181818
            border_color: 0x808080
            border_width: 1
            shadow_width: 0
            widgets:
              - label:
                  text: "${tr_wifi_form_cancel}"
                  text_font: nabla_font_16
                  align: CENTER
            on_click:
              - script.execute: nav_back
        - button:
            id: wifi_form_scan
            bg_color: 0x000000
            border_width: 1
            shadow_width: 0
            widgets:
              - label:
                  text: "${tr_flow_3}"
                  text_font: nabla_font_12
                  align: CENTER
            on_click:
              - lambda: nabla_wifi_form::editor.start_scan();
        - checkbox:
            id: wifi_form_open
            text: "${tr_flow_2}"
            text_font: nabla_font_12

# Export helpers from the same checkout as the external component.
nabla_runtime:
  - headers:
      - components/keyboard/latin_keyboard.h
      - components/forms/wifi_flow.h
      - components/wifi-form/form.h
