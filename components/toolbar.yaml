# Persistent black toolbar. Hidden only during splash.
obj:
  id: navigation_toolbar
  hidden: true
  width: 100%
  height: 52
  bg_color: ${nabla_background}
  border_width: 1
  border_side: BOTTOM
  border_color: ${nabla_accent}
  pad_all: 0
  widgets:
    - button:
        id: toolbar_home
        x: 4
        y: 4
        width: 44
        height: 44
        pad_all: 0
        bg_color: ${nabla_background}
        border_color: ${nabla_accent}
        border_width: 0
        radius: 0
        widgets:
          - image:
              id: toolbar_home_image
              src: nabla_toolbar_logo
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current));
    - button:
        id: toolbar_crumb_0
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_accent}
        border_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_0
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: ${nabla_accent}
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda 'return id(nav_current) ? nabla::children(id(nav_current)) + 1 : -1;'
    - button:
        id: toolbar_crumb_1
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_accent}
        border_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_1
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: ${nabla_accent}
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 1;
    - button:
        id: toolbar_crumb_2
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_accent}
        border_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_2
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: ${nabla_accent}
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 2;
    - button:
        id: toolbar_close
        align: TOP_RIGHT
        x: -4
        y: 4
        width: 44
        height: 44
        bg_color: ${nabla_background}
        border_color: ${nabla_accent}
        border_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_close_label
              text: "X"
              text_color: ${nabla_accent}
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + id(nav_crumbs).size();
