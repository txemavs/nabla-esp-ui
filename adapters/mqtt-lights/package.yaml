# Regular LVGL editor over the shared MQTT transport.
packages:
  transport: !include transport.yaml
  light_panel: !include ../../components/light-card/panel.yaml
substitutions:
  nabla_mqtt_command_topics: "std::vector<std::string>(16)"
  nabla_light_state: "nabla_light::State{nabla_mqtt_lights::model.states[slot].on,nabla_mqtt_lights::model.states[slot].brightness,nabla_mqtt_lights::model.states[slot].dimmable,nabla_mqtt_lights::model.available(slot,millis())}"
  nabla_light_pending: "nabla_mqtt_lights::model.pending[slot] != 0"
  nabla_light_footer: "MQTT"
interval:
  - interval: 250ms
    then:
      - lambda: |-
          nabla_mqtt_lights::model.tick(millis());
          if(nabla_mqtt_lights::model.dirty && !nabla_light::editor.active()) {
            nabla_mqtt_lights::model.dirty=false;
            id(nav_render).execute();
          }
script:
  - id: control_open
    parameters:
      slot: int
      title: std::string
    then:
      - lambda: |-
          auto &model=nabla_mqtt_lights::model;
          if(!model.ready(slot,millis())) return;
          const auto state=model.states[slot];
          if(state.dimmable) {
            nabla_light::editor.open(title.c_str(),
              {state.on,state.brightness,true,true},
              {"${tr_light_on}","${tr_light_off}","${tr_light_unavailable}","${tr_light_brightness}","${tr_light_apply}","${tr_light_cancel}"},
              id(nabla_ubuntu_16)->get_lv_font(),id(nav_dark),
              [slot](nabla_light::State value){id(control_send).execute(slot,value.on,value.brightness);});
          } else id(control_send).execute(slot,!state.on,state.brightness);
