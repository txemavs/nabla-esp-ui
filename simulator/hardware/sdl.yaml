host:

esphome:
  on_boot:
    priority: 800
    then:
      - lambda: App.set_loop_interval(1);

logger:

display:
  - platform: sdl
    id: simulator_display
    dimensions:
      width: ${screen_width}
      height: ${screen_height}
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: sdl
    id: simulator_touch
    display: simulator_display
    update_interval: 5ms
