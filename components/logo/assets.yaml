substitutions:
  nabla_resource_root: ".."

# SVG is the editable geometric source; ESPHome rasterizes at build time.
image:
  - platform: file
    file: ${nabla_resource_root}/components/logo/silver.svg
    id: nabla_logo_large
    type: RGB565
    transparency: alpha_channel
    resize: 180x180
  - platform: file
    file: ${nabla_resource_root}/components/logo/silver.svg
    id: nabla_logo_small
    type: RGB565
    transparency: alpha_channel
    resize: 36x36

  - platform: file
    file: ${nabla_resource_root}/components/logo/filled.svg
    id: nabla_logo_filled_small
    type: RGB565
    transparency: alpha_channel
    resize: 36x36


script:
  - id: nabla_logo_set_color
    parameters:
      target: lv_obj_t*
      color: int
    then:
      - lambda: |-
          if (!target) return;
          lv_obj_set_style_image_recolor(target, lv_color_hex(color), 0);
          lv_obj_set_style_image_recolor_opa(target, LV_OPA_COVER, 0);
  - id: nabla_logo_spin
    parameters:
      target: lv_obj_t*
    then:
      - lambda: nabla_logo::spin(target);

# Export helpers from the same checkout as the external component.
nabla_runtime:
  - headers:
      - components/logo/motion.h
