# Shared progress bar surface, shown as a footer in the example.
obj:
  <<: !include
    file: ../bar/surface.yaml
    vars:
      bar_id: progress_footer
      anchor: BOTTOM_MID
      background: 0x404040
  hidden: true
  widgets:
    - label:
        id: footer_brand
        align: LEFT_MID
        x: 6
        width: ${(screen_width | int) - 96}
        text: "Soluciones lógicas NABLA"
        text_font: nabla_font_16
        text_color: 0xFFFFFF
        long_mode: DOT
        clickable: false
    - label:
        id: footer_clock
        align: RIGHT_MID
        x: -6
        width: 64
        text: "--:--"
        text_align: RIGHT
        text_font: nabla_font_16
        text_color: 0xFFFFFF
        clickable: false
    - obj:
        id: footer_progress_track
        x: 6
        y: ${(nabla_bar_height | int) - 18}
        width: ${(screen_width | int) - 88}
        height: 3
        bg_color: 0x707070
        border_width: 0
        pad_all: 0
        radius: 0
        clickable: false
        widgets:
          - obj:
              id: footer_progress_fill
              width: 1
              height: 100%
              bg_color: ${nabla_accent}
              border_width: 0
              pad_all: 0
              radius: 0
              clickable: false
    - label:
        id: footer_progress_label
        align: BOTTOM_RIGHT
        x: -6
        y: -5
        width: 58
        text: "0%"
        text_align: RIGHT
        text_font: nabla_font_16
        text_color: ${nabla_accent}
        clickable: false
