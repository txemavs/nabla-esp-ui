# Standalone 480x320 password keyboard preview.
substitutions:
  ui_language: es

esphome:
  name: nabla-password
  on_boot:
    priority: -100
    then:
      - lambda: |-
          App.set_loop_interval(1);
          id(password_key_up).publish_state(false);
          id(password_key_down).publish_state(false);
          id(password_key_return).publish_state(false);
          id(password_key_escape).publish_state(false);

host:
logger:
packages:
  locale: !include ../locales/${ui_language}.yaml
  theme: !include ../theme/nabla.yaml
  editor: !include ../examples/password/ui.yaml

display:
  - platform: sdl
    id: password_display
    dimensions:
      width: 480
      height: 320
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: sdl
    display: password_display
    update_interval: 5ms

binary_sensor:
  - platform: sdl
    sdl_id: password_display
    id: password_key_up
    key: SDLK_UP
    on_press:
      - script.execute:
          id: password_move
          delta: -1
  - platform: sdl
    sdl_id: password_display
    id: password_key_down
    key: SDLK_DOWN
    on_press:
      - script.execute:
          id: password_move
          delta: 1
  - platform: sdl
    sdl_id: password_display
    id: password_key_return
    key: SDLK_RETURN
    on_press:
      - script.execute: password_press
  - platform: sdl
    sdl_id: password_display
    id: password_key_escape
    key: SDLK_ESCAPE
    on_press:
      - script.execute: password_cancel
