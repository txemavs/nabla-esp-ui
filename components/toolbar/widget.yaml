# Persistent black toolbar; one shared logo for startup and navigation.
obj:
  id: navigation_toolbar
  width: 100%
  height: 52
  bg_color: ${nabla_background}
  border_width: 0
  border_side: BOTTOM
  border_color: ${nabla_secondary}
  pad_all: 0
  widgets:
    - obj:
        id: toolbar_divider
        x: 26
        y: 43
        width: ${(screen_width | int) - 30}
        height: 1
        bg_color: ${nabla_secondary}
        border_width: 0
        pad_all: 0
        clickable: false
    - button:
        id: toolbar_home
        x: 4
        y: 4
        width: 44
        height: 44
        pad_all: 0
        bg_color: ${nabla_background}
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - !include
              file: ../logo/widget.yaml
              vars:
                widget_id: toolbar_logo
                size: 36
                image_id: nabla_logo_small
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current));
    - button:
        id: toolbar_crumb_0
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_0
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda 'return id(nav_current) ? nabla::children(id(nav_current)) + 1 : -1;'
    - button:
        id: toolbar_crumb_1
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_1
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 1;
    - button:
        id: toolbar_crumb_2
        x: 54
        y: 4
        width: 110
        height: 44
        pad_all: 4
        bg_color: ${nabla_background}
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_crumb_label_2
              text: ""
              width: 100%
              text_font: nabla_font_16
              text_color: 0xFFFFFF
              long_mode: DOT
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + 1 + 2;
    - button:
        id: toolbar_close
        align: TOP_RIGHT
        x: -4
        y: 4
        width: 44
        height: 44
        bg_color: ${nabla_background}
        border_color: ${nabla_secondary}
        border_width: 0
        shadow_width: 0
        radius: 0
        widgets:
          - label:
              id: toolbar_close_label
              text: "X"
              text_color: 0xFFFFFF
              align: CENTER
        on_click:
          - script.execute:
              id: nav_choose
              index: !lambda return nabla::children(id(nav_current)) + id(nav_crumbs).size();
