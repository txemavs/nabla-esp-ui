# Tiny monochrome profile defaults; supplies geometry and fonts for a native 128x64 compact display.

substitutions:
  ui_profile: tiny
  compact_readable: "false"
  compact_app_footer: "false"
  screen_width: "128"
  screen_height: "64"
  compact_rows: "3"
  compact_bar_height: "12"
  # Typography: header titles 10px, list body 11px, icon labels 17px.
  # Header +1px for readability; body +1px uses spare bottom margin.
  compact_small_size: "10"
  compact_body_size: "11"
  compact_large_size: "17"
  # Smaller icon (16px vs 20px) for better label space in icon mode.
  compact_icon_size: "16"
  # List mode hides footer; readable (fullscreen icon) keeps it.
  compact_list_footer: "false"
