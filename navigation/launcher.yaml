# One menu definition for the initial landscape profile.
obj:
  width: 100%
  height: 100%
  bg_opa: TRANSP
  border_width: 0
  pad_all: 12
  layout:
    type: grid
    pad_row: 10
    pad_column: 10
    grid_columns: [FR(1), FR(1), FR(1), FR(1)]
    grid_rows: [FR(1), FR(1)]
  widgets:
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_0
          title: "Ajustes"
          icon: "${icon_settings}"
          column: 0
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_1
          title: "Reloj"
          icon: "${icon_clock}"
          column: 1
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_2
          title: "Fotos"
          icon: "${icon_photos}"
          column: 2
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_3
          title: "Música"
          icon: "${icon_music}"
          column: 3
          row: 0
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_4
          title: "Vídeo"
          icon: "${icon_video}"
          column: 0
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_5
          title: "Tiempo"
          icon: "${icon_weather}"
          column: 1
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_6
          title: "Luces"
          icon: "${icon_lights}"
          column: 2
          row: 1
    - !include
        file: ../components/menu-tile.yaml
        vars:
          tile_id: menu_tile_7
          title: "Sensores"
          icon: "${icon_sensors}"
          column: 3
          row: 1
