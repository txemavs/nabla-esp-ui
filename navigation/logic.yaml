esphome:
  includes:
    - ../navigation/tree.h

globals:
  - id: nav_current
    type: int
    initial_value: '0'
  - id: nav_selection
    type: int
    initial_value: '0'

script:
  - id: nav_choose
    mode: restart
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: return nabla::child(id(nav_current), index) >= 0;
          then:
            - lambda: id(nav_selection) = index;
            - script.execute: nav_render
            - delay: 120ms
            - script.execute:
                id: nav_open
                node: !lambda return nabla::child(id(nav_current), id(nav_selection));
  - id: nav_open
    parameters:
      node: int
    then:
      - lambda: |-
          if (!nabla::valid(node)) return;
          id(nav_current) = node;
          id(nav_selection) = 0;
      - script.execute: nav_render
  - id: nav_back
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: !lambda 'return id(nav_current) == 0 ? 0 : nabla::nodes[id(nav_current)].parent;'
  - id: nav_home
    then:
      - script.stop: nav_choose
      - script.execute:
          id: nav_open
          node: 0
  - id: nav_move
    parameters:
      delta: int
    then:
      - script.stop: nav_choose
      - lambda: |-
          int total = 0;
          while (nabla::child(id(nav_current), total) >= 0) total++;
          if (total) id(nav_selection) = (id(nav_selection) + delta % total + total) % total;
      - script.execute: nav_render
  - id: nav_activate
    then:
      - script.execute:
          id: nav_choose
          index: !lambda return id(nav_selection);
  - id: nav_render
    then:
      - lambda: |-
          int current = id(nav_current);
          ESP_LOGI("navigation", "%s", nabla::path(current).c_str());
          lv_label_set_text(id(nav_breadcrumb), nabla::path(current).c_str());
          lv_label_set_text(id(nav_detail), nabla::nodes[current].detail);
          lv_obj_set_style_border_color(id(menu_tile_0), lv_color_hex(id(nav_selection) == 0 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_0), id(nav_selection) == 0 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_1), lv_color_hex(id(nav_selection) == 1 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_1), id(nav_selection) == 1 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_2), lv_color_hex(id(nav_selection) == 2 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_2), id(nav_selection) == 2 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_3), lv_color_hex(id(nav_selection) == 3 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_3), id(nav_selection) == 3 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_4), lv_color_hex(id(nav_selection) == 4 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_4), id(nav_selection) == 4 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_5), lv_color_hex(id(nav_selection) == 5 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_5), id(nav_selection) == 5 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_6), lv_color_hex(id(nav_selection) == 6 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_6), id(nav_selection) == 6 ? 2 : 1, 0);
          lv_obj_set_style_border_color(id(menu_tile_7), lv_color_hex(id(nav_selection) == 7 ? 0xFFFFFF : ${nabla_accent}), 0);
          lv_obj_set_style_border_width(id(menu_tile_7), id(nav_selection) == 7 ? 2 : 1, 0);
          {
            int n = nabla::child(current, 0);
            if (n < 0) lv_obj_add_flag(id(nav_row_0), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_0), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_0), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_0), id(nav_selection) == 0 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_0), lv_color_hex(id(nav_selection) == 0 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 1);
            if (n < 0) lv_obj_add_flag(id(nav_row_1), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_1), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_1), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_1), id(nav_selection) == 1 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_1), lv_color_hex(id(nav_selection) == 1 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 2);
            if (n < 0) lv_obj_add_flag(id(nav_row_2), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_2), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_2), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_2), id(nav_selection) == 2 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_2), lv_color_hex(id(nav_selection) == 2 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 3);
            if (n < 0) lv_obj_add_flag(id(nav_row_3), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_3), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_3), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_3), id(nav_selection) == 3 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_3), lv_color_hex(id(nav_selection) == 3 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 4);
            if (n < 0) lv_obj_add_flag(id(nav_row_4), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_4), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_4), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_4), id(nav_selection) == 4 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_4), lv_color_hex(id(nav_selection) == 4 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 5);
            if (n < 0) lv_obj_add_flag(id(nav_row_5), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_5), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_5), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_5), id(nav_selection) == 5 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_5), lv_color_hex(id(nav_selection) == 5 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 6);
            if (n < 0) lv_obj_add_flag(id(nav_row_6), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_6), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_6), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_6), id(nav_selection) == 6 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_6), lv_color_hex(id(nav_selection) == 6 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
          {
            int n = nabla::child(current, 7);
            if (n < 0) lv_obj_add_flag(id(nav_row_7), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(nav_row_7), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(nav_row_label_7), nabla::nodes[n].title);
              lv_obj_set_style_border_width(id(nav_row_7), id(nav_selection) == 7 ? 2 : 1, 0);
              lv_obj_set_style_border_color(id(nav_row_7), lv_color_hex(id(nav_selection) == 7 ? 0xFFFFFF : ${nabla_accent}), 0);
            }
          }
      - if:
          condition:
            lambda: return id(nav_current) == 0;
          then:
            - lvgl.page.show: home_page
          else:
            - lvgl.page.show: navigation_page
      - lambda: |-
          if (id(nav_current) != 0) {
            lv_obj_t *rows[] = {id(nav_row_0), id(nav_row_1), id(nav_row_2), id(nav_row_3), id(nav_row_4), id(nav_row_5), id(nav_row_6), id(nav_row_7)};
            int selected = id(nav_selection);
            if (selected >= 0 && selected < 8 && nabla::child(id(nav_current), selected) >= 0)
              lv_obj_scroll_to_view(rows[selected], LV_ANIM_OFF);
          }
