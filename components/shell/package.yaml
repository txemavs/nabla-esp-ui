# Shared launcher; enter immediately without a simulated boot delay.
esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: nav_home

packages:
  toolbar_progress: !include ../../components/toolbar/progress.yaml
  navigation: !include ../../navigation/logic.yaml
  forms: !include ../../components/forms/package.yaml
  wifi_form: !include ../../components/wifi-form/package.yaml

lvgl:
  id: nabla_lvgl
  rotation: ${nabla_initial_rotation}
  buffer_size: 100%
  default_font: nabla_font_20
  top_layer:
    widgets:
      - !include ../../components/toolbar.yaml
      - !include ../../components/progress/widget.yaml
  pages:
    - id: home_page
      bg_color: ${nabla_background}
      widgets:
        - !include ../../navigation/launcher.yaml
    - id: navigation_page
      bg_color: ${nabla_background}
      text_color: ${nabla_text}
      widgets:
        - obj:
            id: navigation_content
            x: 4
            y: ${(nabla_bar_height | int) + 2}
            width: ${(screen_width | int) - 4}
            height: ${(screen_height | int) - (nabla_bar_height | int) - 6}
            pad_all: 2
            pad_right: 6
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 6
            widgets:
              - label:
                  id: nav_detail
                  width: ${(screen_width | int) - 16}
                  text_font: nabla_font_16
                  text: ""
              - button:
                  id: nav_row_0
                  width: ${(screen_width | int) - 16}
                  height: 48
                  shadow_width: 0
                  bg_color: 0x181818
                  border_color: ${nabla_secondary}
                  border_width: 1
                  pressed:
                    border_color: 0xFFFFFF
                    border_width: 2
                  widgets:
                    - label:
                        id: nav_row_label_0
                        text: ""
                        align: LEFT_MID
                        text_font: nabla_font_20
                  on_press:
                    - script.stop: nav_choose
                    - script.execute:
                        id: nav_focus
                        index: 0
                  on_click:
                    - script.execute:
                        id: nav_choose
                        index: 0
