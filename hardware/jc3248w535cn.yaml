# Guition JC3248W535CN board composition
# ESP32-S3, 16 MiB flash, 8 MiB octal PSRAM, JC3248W535 QSPI display, AXS15231 touch.
#
# This composer imports reusable capability packages. See hardware/ subfolders
# for individual display, touchscreen, power and bus configurations.

substitutions:
  nabla_display_kind: "IPS LCD"
  nabla_device_model: "JC3248W535CN"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

packages:
  qspi_bus: !include bus/jc3248w535cn-qspi.yaml
  i2c_bus: !include bus/jc3248w535cn-i2c.yaml
  backlight: !include power/backlight-gpio1.yaml
  display: !include display/jc3248w535.yaml
  touch: !include touchscreen/axs15231.yaml
