# Regular host demonstration entry point; composes the shared UI with synthetic menu data for development.

substitutions:
  ui_language: es
  screen_width: "480"
  screen_height: "320"

esphome:
  name: nabla-simulator

packages:
  locale: !include ../locales/${ui_language}.yaml
  hardware: !include hardware/sdl.yaml
  theme: !include ../theme/nabla.yaml
  profile: !include ../profiles/regular.yaml
  ui: !include ../examples/hello-world/ui.yaml
