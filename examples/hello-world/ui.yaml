# Shared splash and launcher demo; app pages are placeholders.
esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: nav_home
      - script.execute:
          id: nabla_logo_spin
          target: !lambda return id(toolbar_logo_image);

packages:
  navigation: !include ../../navigation/logic.yaml
  catalog: !include navigation.yaml

lvgl:
  buffer_size: 100%
  default_font: nabla_font_20
  top_layer:
    widgets:
      - !include ../../components/toolbar.yaml
  pages:
    - id: home_page
      bg_color: ${nabla_background}
      widgets:
        - !include ../../navigation/launcher.yaml
    - id: navigation_page
      bg_color: ${nabla_background}
      text_color: ${nabla_text}
      widgets:
        - obj:
            id: navigation_content
            x: 8
            y: 56
            width: 464
            height: 256
            pad_all: 4
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 6
            widgets:
              - label:
                  id: nav_detail
                  width: 440
                  text_font: nabla_font_16
                  text: ""
              - button:
                  id: nav_row_0
                  width: 440
                  height: 48
                  shadow_width: 0
                  bg_color: 0x181818
                  border_color: ${nabla_secondary}
                  border_width: 1
                  pressed:
                    border_color: 0xFFFFFF
                    border_width: 2
                  widgets:
                    - label:
                        id: nav_row_label_0
                        text: ""
                        align: LEFT_MID
                        text_font: nabla_font_20
                  on_click:
                    - script.execute:
                        id: nav_choose
                        index: 0
              - button:
                  id: nav_row_1
                  width: 440
                  height: 48
                  shadow_width: 0
                  bg_color: 0x181818
                  border_color: ${nabla_secondary}
                  border_width: 1
