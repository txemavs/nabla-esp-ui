# SVG is the editable geometric source; ESPHome rasterizes at build time.
image:
  - platform: file
    file: ../components/logo/silver.svg
    id: nabla_logo_large
    type: RGB565
    transparency: alpha_channel
    resize: 180x180
  - platform: file
    file: ../components/logo/silver.svg
    id: nabla_logo_small
    type: RGB565
    transparency: alpha_channel
    resize: 36x36

esphome:
  includes:
    - ../components/logo/motion.h

script:
  - id: nabla_logo_spin
    parameters:
      target: lv_obj_t*
    then:
      - lambda: nabla_logo::spin(target);
