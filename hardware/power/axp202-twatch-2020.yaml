# AXP202 PMU initialization for LilyGO T-Watch 2020
# Enables LDO2 (backlight) and LDO3 via direct I2C writes.
# Uses sensor_i2c bus (SDA GPIO21, SCL GPIO22), address 0x35.
#
# AXP202 power domains on T-Watch 2020:
# - LDO2: Backlight (set to 3.0V)
# - LDO3: Audio module (V1) or TFT/Touch (V2)
# - DC3: ESP32 core (cannot disable)
#
# This provides basic backlight enable only. Full PMU features
# (battery monitoring, charging control) require an external component.

esphome:
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // AXP202 I2C address
          const uint8_t AXP202_ADDR = 0x35;
          // Registers
          const uint8_t AXP202_LDO234_DC23_CTL = 0x12;  // LDO2/3/4 + DC2/3 enable
          const uint8_t AXP202_LDO24OUT_VOL = 0x28;     // LDO2 voltage (upper nibble)
          
          // Read current power control state using write_readv
          uint8_t reg_addr = AXP202_LDO234_DC23_CTL;
          uint8_t data = 0;
          esphome::i2c::WriteBuffer w_buf = {&reg_addr, 1};
          esphome::i2c::ReadBuffer r_buf = {&data, 1};
          
          if (id(sensor_i2c).write_readv(AXP202_ADDR, &w_buf, 1, &r_buf, 1) != esphome::i2c::ERROR_OK) {
            ESP_LOGW("axp202", "Failed to read AXP202 power register");
            return;
          }
          
          // Enable LDO2 (bit 2) and LDO3 (bit 3)
          data |= (1 << 2) | (1 << 3);
          uint8_t enable_cmd[2] = {AXP202_LDO234_DC23_CTL, data};
          if (id(sensor_i2c).write(AXP202_ADDR, enable_cmd, 2, true) != esphome::i2c::ERROR_OK) {
            ESP_LOGW("axp202", "Failed to enable AXP202 LDO2/LDO3");
            return;
          }
          
          // Set LDO2 voltage to 3.0V for backlight (bits 4-7)
          // 0x0C = 12 -> 1.8V + 12*0.1V = 3.0V
          uint8_t voltage_cmd[2] = {AXP202_LDO24OUT_VOL, (uint8_t)(0x0C << 4)};
          if (id(sensor_i2c).write(AXP202_ADDR, voltage_cmd, 2, true) != esphome::i2c::ERROR_OK) {
            ESP_LOGW("axp202", "Failed to set AXP202 LDO2 voltage");
            return;
          }
          
          ESP_LOGI("axp202", "AXP202 LDO2+LDO3 enabled, backlight at 3.0V");
